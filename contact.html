<body class="page">

  <!-- Menu button (top left) -->

  <div class="menu-overlay"></div>

  <!-- Static background image (darkened on subpages so text is easy to read) -->
  <div class="bg" aria-hidden="true"></div>

  <main class="content">
    <h1>Contact</h1>

    <p>Send me a note using the form below.</p>

    <!--
      This form uses Web3Forms (web3forms.com), which emails each message to you.
      1. Get a free access key at web3forms.com (enter your email, the key arrives in your inbox).
      2. Replace YOUR_ACCESS_KEY_HERE below with that key.
      The key is safe to leave in the page; your email address is not shown to visitors.
    -->
    <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="7f456020-65fb-4381-9c6b-acda6661f4be">
      <input type="hidden" name="subject" value="New message from danielknowlton.com">
      <input type="hidden" name="from_name" value="danielknowlton.com contact form">

      <!-- Hidden spam trap: people never see this, but bots tend to fill it in -->
      <input type="checkbox" name="botcheck" style="display: none;" tabindex="-1" autocomplete="off">

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="7" required></textarea>
      </div>

      <button type="submit" class="form-button">Send</button>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js"></script>
  <script src="contact.js"></script>
</body>
