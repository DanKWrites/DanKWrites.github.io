  <main class="content">
    <h1>Contact</h1>

    <p>Questions? Comments? Drop me a line with the form below!</p>

    <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="7f456020-65fb-4381-9c6b-acda6661f4be">
      <input type="hidden" name="subject" value="New message from danielknowlton.com">
      <input type="hidden" name="from_name" value="danielknowlton.com contact form">
      <input type="checkbox" name="botcheck" style="display: none;" tabindex="-1" autocomplete="off">

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="7" required></textarea>
      </div>

      <button type="submit" class="form-button">Send</button>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>
